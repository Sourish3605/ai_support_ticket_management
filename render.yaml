services:
  - type: web
    name: ai-support-ticket-management
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ALLOWED_HOSTS
        value: "ai-support-ticket-management.onrender.com"
